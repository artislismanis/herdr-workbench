# One talk per stage: what's needed, then how to build it. Your yes to the agent's summary is
# the go, and nothing reaches the ticket before it. Copy to ~/.config/workshop/pipelines/ to change it.
name = "prepare"

[[steps]]
id = "requirements"
stage = "Plan"
kind = "agent"
prompt = "grill-requirements.md"
interactive = true
fresh = true
read_only = true
verdict = ["READY"]
section = "Requirements"
label = "planned"

[[steps]]
id = "design"
stage = "Design"
kind = "agent"
prompt = "grill-design.md"
interactive = true
fresh = true
read_only = true
verdict = ["READY"]
section = "Design"
label = "designed"
