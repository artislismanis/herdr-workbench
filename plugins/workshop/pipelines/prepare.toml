# One talk per stage: what's needed, how to build it, then whether it's queued and where. Each run
# does the next stage the ticket hasn't reached, and the design talk asks about the queue too. Your yes to the agent's summary is the go, and nothing reaches the ticket before it.
# Copy to ~/.config/workshop/pipelines/ to change it.
name = "prepare"

[[steps]]
id = "requirements"
stage = "Plan"
kind = "agent"
prompt = "grill-requirements.md"
interactive = true
fresh = true
read_only = true
verdict = ["READY"]
section = "Requirements"
label = "planned"

[[steps]]
id = "design"
stage = "Design"
kind = "agent"
prompt = "grill-design.md"
interactive = true
fresh = true
read_only = true
verdict = ["READY"]
section = "Design"
label = "designed"
queues = true

[[steps]]
id = "queue"
stage = "Queue"
kind = "agent"
prompt = "queue.md"
interactive = true
fresh = true
read_only = true
verdict = ["READY"]
queues = true
