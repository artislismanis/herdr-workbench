# A scheduled look at a repo. Nothing changes until your go on what it proposes. Copy to ~/.config/workshop/pipelines/ to change it.
name = "sweep-deps"

[[steps]]
id = "sweep"
stage = "Maintain"
kind = "agent"
prompt = "sweep-deps.md"
fresh = true
read_only = true
proposes = true
verdict = ["DONE"]

[[steps]]
id = "decide"
stage = "Maintain"
kind = "gate"
go = "do it"
change = "n to skip it, or guidance for the agent"
report = "sweep"
proposals = true
