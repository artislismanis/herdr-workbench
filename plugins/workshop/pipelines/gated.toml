# Like ticket, but a person approves the tasks before anything is built:
# workshop approve <key>, or workshop reject <key> "what to change".
name = "gated"
ticket_stage = "Plan and Design"

[[steps]]
id = "tasks"
stage = "Build"
kind = "agent"
prompt = "tasks.md"
read_only = true
verdict = ["READY", "BLOCKED"]
then.BLOCKED = { park = "The ticket needs clarifying before it can be built." }

[[steps]]
id = "approve"
stage = "Build"
kind = "gate"
report = "tasks"
then.REJECTED = { goto = "tasks", max = 2, prompt = "revise.md" }

[[steps]]
id = "implement"
stage = "Build"
kind = "agent"
prompt = "implement.md"
publish = "pr"

[[steps]]
id = "qa"
stage = "Test"
kind = "command"
verdict = ["PASS", "FAILED"]
then.FAILED = { goto = "implement", max = 2, prompt = "fix-qa.md" }

[[steps]]
id = "ai-review"
stage = "Test"
kind = "agent"
prompt = "ai-review.md"
fresh = true
read_only = true
verdict = ["PASS", "CHANGES_NEEDED"]
then.CHANGES_NEEDED = { goto = "implement", max = 2, prompt = "fix.md" }

[[steps]]
id = "open-pr"
stage = "Deploy"
kind = "draft_pr"
