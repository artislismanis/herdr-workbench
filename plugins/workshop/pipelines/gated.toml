# Like ticket, but a person approves the plan before anything is built:
# workshop approve <key>, or workshop reject <key> "what to change".
name = "gated"

[[steps]]
id = "plan"
kind = "agent"
prompt = "plan.md"
read_only = true
verdict = ["READY", "BLOCKED"]
then.BLOCKED = { park = "The ticket needs clarifying before it can be built." }

[[steps]]
id = "approve"
kind = "gate"
report = "plan"
then.REJECTED = { goto = "plan", max = 2, prompt = "replan.md" }

[[steps]]
id = "build"
kind = "agent"
prompt = "build.md"

[[steps]]
id = "verify"
kind = "agent"
prompt = "verify.md"
fresh = true
read_only = true
verdict = ["PASS", "CHANGES_NEEDED"]
then.CHANGES_NEEDED = { goto = "build", max = 2, prompt = "fix.md" }

[[steps]]
id = "pr"
kind = "draft_pr"
