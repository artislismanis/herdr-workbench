# A PR to a draft review in hunk. Nothing reaches GitHub until you post it there.
steps = ["qa", "ai-review"]

# Failing tests are something to review, not a reason to stop.
[step.qa]
then.FAILED = { goto = "ai-review", max = 1 }

[step.ai-review]
stage = "Review"
prompt = "review-pr.md"
again = "re-review-pr.md"
verdict = ["APPROVE", "COMMENT", "REQUEST_CHANGES"]
