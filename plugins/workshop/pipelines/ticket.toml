# Ticket to self-reviewed draft PR. Copy to ~/.config/workshop/pipelines/ to change it.
name = "ticket"

[[steps]]
id = "tasks"
stage = "Build"
kind = "agent"
prompt = "tasks.md"
read_only = true
verdict = ["READY", "BLOCKED"]
then.BLOCKED = { park = "The ticket needs clarifying before it can be built." }

[[steps]]
id = "implement"
stage = "Build"
kind = "agent"
prompt = "implement.md"
publish = "pr"

[[steps]]
id = "ai-review"
stage = "Test"
kind = "agent"
prompt = "ai-review.md"
fresh = true
read_only = true
verdict = ["PASS", "CHANGES_NEEDED"]
then.CHANGES_NEEDED = { goto = "implement", max = 2, prompt = "fix.md" }

[[steps]]
id = "open-pr"
stage = "Deploy"
kind = "draft_pr"
