# Copy to ~/.config/workshop/config.toml and chmod 600. Never commit a real one.

# max_active = 2             # runs at once
# comment_prefix = "[ai]"    # starts everything workshop posts, so it never counts as your comment. Change it with no run blocked
#
# A ticket runs only if you were the last person to change it. To run one anyway, add the
# label <label>-override yourself, or use: workshop start <repo> <key> --override

# The labels that mark how far a ticket has been prepared, on the board's Backlog tab. These are
# the defaults. No label is new, and the delivery label means queued.
# [backlog]
# planned = "planned"
# designed = "designed"

# How PR reviews show to others. A repo's table can set its own [repos.<name>.review].
# Silent shows nothing until you post, then claims just before the review. Claimed claims when the
# review starts. `a` on the board uses mode, `A` the other one, and `m` claims one already going.
# claim is none, github-reviewer or github-assignee. Use none where reviewers are assigned for you.
# [review]
# mode = "silent"
# claim = "none"

# The board's PRs tab covers everything GitHub shows you. This narrows it, in GitHub search terms.
# [prs]
# search = "org:my-company"

# Paces work against Claude's limits, in percent. These are the defaults.
# [throttle]
# pause_new_at = 60          # no new tickets above this 5h usage
# pause_steps_at = 85        # no new agent steps above this 5h usage
# weekly_pace_margin = 5     # no new tickets when 7d usage passes the share of the week gone plus this
# weekly_reserve = 25        # no new agent steps in the last of the week's allowance

# One table per repo. `source` is github, jira or markdown.
[repos.my-app]
path = "~/src/my-app"
source = "github"
label = "ai"
# base = "main"
# pipeline = "ticket"        # a file in pipelines/ or ~/.config/workshop/pipelines/
# review_pipeline = "review" # the same, for AI review of a PR
# reply_pipeline = "reply"   # and for answering comments on your own PR
# [repos.my-app.commands]
# qa = "npm test"            # the qa step runs this. Without it, the step is skipped

[repos.my-service]
path = "~/src/my-service"
source = "jira"
label = "ai"                 # tickets need this label and the repo's name
skip_statuses = ["Backlog"]

[repos.my-notes]
path = "~/src/my-notes"
source = "markdown"
intents = "~/intents/my-notes"   # *.md here are queued; done ones move to done/

[jira]
base_url = "https://example.atlassian.net"
email = "you@example.com"
token = ""                   # or set JIRA_TOKEN
# Set this if your board allows only the next column: a longer move walks it.
# route = ["To Do", "In Progress", "Code Review", "Dev Done", "Ready for Release"]

# The Jira status for each move. A move left out doesn't change the ticket. GitHub uses labels instead.
# [jira.moves]
# working = "In Progress"
# blocked = "Pause/Blocked"
# review = "Code Review"          # the PR is out of draft
# approved = "Dev Done"           # approved, not merged
# merged = "Ready for Release"    # later statuses, like Done, belong to your release process
